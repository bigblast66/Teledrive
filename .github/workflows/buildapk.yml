name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/buildapk.yml'

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          
          # Accept licenses without deprecated packages
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm packages
        working-directory: app
        run: npm ci

      - name: Build Android APK
        working-directory: app
        run: npm run tauri android build -- --apk true --ci

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          RAW_APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi

          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
              --out TelegramDrive.apk \
              "$RAW_APK"
          else
            echo "Signing with debug key so APK can be installed on any phone..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$BUILD_TOOLS/apksigner" sign \
              --ks debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out TelegramDrive.apk \
              "$RAW_APK"
          fi

          "$BUILD_TOOLS/apksigner" verify --verbose TelegramDrive.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-apk
          path: |
            TelegramDrive.apk
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
