  build-android:
    runs-on: ubuntu-22.04
  
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
  
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android
  
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
  
      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
  
      - name: Install npm packages
        working-directory: app
        run: npm ci
  
      - name: Build APK
        working-directory: app
        run: npm run tauri android build -- --apk true --ci
  
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks
  
      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
  
      - name: Sign APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n1)
  
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out TelegramDrive.apk \
            "${{ steps.apk.outputs.apk }}"
  
      - name: Verify APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --verbose TelegramDrive.apk
  
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-apk
          path: TelegramDrive.apk
